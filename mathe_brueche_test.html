<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bruch-Trainer 29.10.</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&family=Kalam:wght@400;700&display=swap">
<style>
/* Layout: eine ruhige Spalte auf Karopapier wie im Matheheft; Textmarker-Gelb vom Themenzettel als Akzent, Rotstift für Fehler, Füllerblau für die Tinte. */
:root {
  --paper: #f7f9fc;
  --grid: #e3eaf4;
  --card: #ffffff;
  --ink: #1c2948;
  --muted: #5b6886;
  --line: #d4deec;
  --blue: #2b56c9;
  --blue-soft: #e6edfc;
  --marker: #ffe24a;
  --marker-ink: #2a2300;
  --ok: #18884a;
  --ok-soft: #e3f5ea;
  --bad: #cf3a2a;
  --bad-soft: #fde9e6;
  --warn: #b86a00;
  --warn-soft: #fff1d6;
  --shape: #b9cdf5;
  --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --font-hand: "Kalam", "Comic Sans MS", cursive;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111726; --grid: #1a2236; --card: #192136; --ink: #e7ecf8; --muted: #9aa6c2;
    --line: #2b3652; --blue: #7ea3ff; --blue-soft: #22305a; --marker: #e9cf3c; --marker-ink: #1d1800;
    --ok: #4cc782; --ok-soft: #173426; --bad: #ff7564; --bad-soft: #3a1d1b; --warn: #f0a640; --warn-soft: #3a2a12;
    --shape: #3a5596; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111726; --grid: #1a2236; --card: #192136; --ink: #e7ecf8; --muted: #9aa6c2;
  --line: #2b3652; --blue: #7ea3ff; --blue-soft: #22305a; --marker: #e9cf3c; --marker-ink: #1d1800;
  --ok: #4cc782; --ok-soft: #173426; --bad: #ff7564; --bad-soft: #3a1d1b; --warn: #f0a640; --warn-soft: #3a2a12;
  --shape: #3a5596; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.55;
  color: var(--ink);
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  min-height: 100vh;
}
.wrap {
  max-width: 780px;
  margin: 0 auto;
  padding-block: 18px 60px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; }
button { font: inherit; color: inherit; }
a { color: var(--blue); }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 6px; }

/* Brüche */
.fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; line-height: 1.12; margin: 0 .14em; font-variant-numeric: tabular-nums; font-weight: 700; }
.fr > span { display: block; padding: 0 .22em; white-space: nowrap; }
.fr > span:first-child { border-bottom: 2px solid currentColor; }
.mx { display: inline-flex; align-items: center; gap: .04em; font-weight: 700; white-space: nowrap; }
.mark { background: linear-gradient(transparent 12%, var(--marker) 12%, var(--marker) 88%, transparent 88%); color: var(--marker-ink); padding: 0 .2em; border-radius: 3px; }

/* Kopf */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.back { font-weight: 700; text-decoration: none; font-size: .95em; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--card); border: 1.5px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: .88em; font-weight: 700; color: var(--muted); }
.chip.hot { border-color: var(--bad); color: var(--bad); }
.hero { padding: 6px 0 18px; }
.hero h1 { font-size: clamp(2rem, 6vw, 2.9rem); font-weight: 800; letter-spacing: -.01em; }
.hero h1 .mark { padding: 0 .15em; }
.hero p { margin: 6px 0 0; color: var(--muted); max-width: 60ch; }
.zettel { margin: 16px 0 6px; background: var(--marker); color: var(--marker-ink); border-radius: 4px 4px 14px 4px; padding: 14px 16px; box-shadow: 0 2px 0 rgba(0,0,0,.08); transform: rotate(-.4deg); font-size: .93em; }
.zettel b { font-family: var(--font-display); font-size: 1.1em; }

/* Gesamtfortschritt */
.overall { display: flex; gap: 12px; flex-wrap: wrap; margin: 14px 0 22px; }
.stat { flex: 1 1 140px; background: var(--card); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 10px 14px; }
.stat .k { font-size: .78em; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 800; }
.stat .v { font-family: var(--font-display); font-size: 1.6em; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }

.section-label { font-size: .8em; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 800; margin: 22px 0 10px; }
.topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.topic {
  text-align: left; cursor: pointer; background: var(--card); border: 1.5px solid var(--line); border-radius: var(--radius);
  padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0;
  transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
}
.topic:hover { transform: translateY(-2px); border-color: var(--blue); box-shadow: 0 6px 18px rgba(30,50,110,.12); }
.topic .nr { font-family: var(--font-hand); color: var(--blue); font-size: 1.05em; }
.topic h3 { font-size: 1.22em; }
.topic .pg { font-size: .85em; color: var(--muted); font-weight: 700; }
.stars { letter-spacing: 2px; font-size: 1.05em; color: var(--line); }
.stars .on { color: #f2b705; }
.topic.special { background: var(--blue); border-color: var(--blue); color: var(--card); }
.topic.special .nr, .topic.special .pg { color: var(--card); opacity: .85; }
.topic.fehler { border-style: dashed; border-color: var(--bad); }
.topic.fehler .nr { color: var(--bad); }

/* Karten allgemein */
.card { background: var(--card); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 18px 18px; }
.learn h2 { font-size: 1.7em; }
.learn h3 { font-size: 1.2em; margin-top: 18px; margin-bottom: 6px; }
.learn p { margin: 6px 0; }
.merke { background: var(--blue-soft); border-radius: 10px; padding: 12px 14px; margin: 12px 0; }
.merke .t { font-family: var(--font-hand); font-weight: 700; color: var(--blue); font-size: 1.15em; }
.bsp { border: 2px dashed var(--line); border-radius: 10px; padding: 10px 14px; margin: 10px 0; }
.bsp .t, .falle .t { font-family: var(--font-hand); font-weight: 700; font-size: 1.1em; }
.falle { background: var(--bad-soft); border-radius: 10px; padding: 10px 14px; margin: 12px 0; }
.falle .t { color: var(--bad); }
.hand { font-family: var(--font-hand); }
.calc { font-size: 1.15em; line-height: 2.4; }
.tbl { overflow-x: auto; }
.tbl table { border-collapse: collapse; width: 100%; font-size: .95em; }
.tbl td, .tbl th { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: middle; }
.tbl th { font-size: .8em; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.startrow { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }

.btn { cursor: pointer; border: 2px solid transparent; border-radius: 12px; padding: 11px 18px; font-weight: 800; font-size: 1em; background: var(--blue-soft); color: var(--blue); }
.btn:hover { filter: brightness(.97); }
.btn.primary { background: var(--blue); color: var(--card); }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--muted); }
.btn:disabled { opacity: .45; cursor: default; }

/* Quiz */
.qhead { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.bar { flex: 1; height: 12px; background: var(--card); border: 1.5px solid var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--ok); border-radius: 99px; transition: width .3s ease; }
.qcount { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--muted); font-size: .9em; white-space: nowrap; }
.streak { font-weight: 800; color: var(--warn); font-size: .9em; white-space: nowrap; }
.qcard { position: relative; }
.qmeta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
.src { font-family: var(--font-hand); font-weight: 700; background: var(--marker); color: var(--marker-ink); padding: 1px 10px; border-radius: 4px; font-size: .95em; }
.tag { font-size: .78em; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.tag.twin { color: var(--blue); }
.tag.rep { color: var(--bad); }
.qtitle { font-size: 1.35em; margin-bottom: 8px; }
.qbody { font-size: 1.12em; }
.qbody .big { font-size: 1.5em; line-height: 2.1; }
.answer { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
.fin { display: inline-flex; align-items: center; gap: 6px; }
.fin .stack { display: inline-flex; flex-direction: column; align-items: center; gap: 4px; }
.fin .stack hr { width: 100%; border: 0; border-top: 3px solid var(--ink); margin: 0; }
.fin input, .num input {
  width: 4.2em; padding: 7px 6px; text-align: center; font: inherit; font-weight: 800; font-size: 1.15em;
  border: 2px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.fin input.w { width: 3.4em; font-size: 1.4em; }
.fin input:focus, .num input:focus { outline: none; border-color: var(--blue); background: var(--card); }
.fin .lbl { font-size: .72em; color: var(--muted); font-weight: 700; }
.fin .wbox { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.num { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.num label { font-weight: 700; }
.num .unit { font-weight: 800; color: var(--muted); }
.or { color: var(--muted); font-weight: 700; }
.opts { display: grid; gap: 8px; width: 100%; }
.opt { text-align: left; cursor: pointer; border: 2px solid var(--line); border-radius: 12px; padding: 10px 14px; background: var(--paper); font-weight: 700; }
.opt:hover { border-color: var(--blue); }
.opt.sel { border-color: var(--blue); background: var(--blue-soft); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.cmp { display: flex; gap: 10px; }
.cmp button { width: 64px; height: 56px; font-size: 1.8em; font-weight: 800; border-radius: 12px; border: 2px solid var(--line); background: var(--paper); cursor: pointer; }
.cmp button.sel { border-color: var(--blue); background: var(--blue-soft); color: var(--blue); }
.cmpline { display: flex; align-items: center; gap: 14px; font-size: 1.5em; flex-wrap: wrap; }
.slot { display: inline-flex; width: 1.6em; height: 1.6em; border: 2px dashed var(--muted); border-radius: 6px; align-items: center; justify-content: center; color: var(--blue); font-weight: 800; }
.pool, .seq { display: flex; flex-wrap: wrap; gap: 8px; min-height: 64px; width: 100%; padding: 8px; border-radius: 12px; align-items: center; }
.pool { background: var(--paper); border: 2px solid var(--line); }
.seq { border: 2px dashed var(--blue); }
.seq:empty::before { content: "Tippe die Brüche der Reihe nach an – mit dem kleinsten anfangen."; color: var(--muted); font-size: .9em; }
.piece { cursor: pointer; border: 2px solid var(--line); background: var(--card); border-radius: 10px; padding: 4px 10px; font-size: 1.15em; }
.piece:hover { border-color: var(--blue); }
.seq .piece { border-color: var(--blue); }
.lt { color: var(--muted); font-weight: 800; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.actions .btn.primary { margin-left: auto; }
.msg { color: var(--bad); font-weight: 700; margin-top: 8px; min-height: 1em; }
.tipbox { margin-top: 14px; background: var(--marker); color: var(--marker-ink); border-radius: 10px; padding: 10px 14px; }
.tipbox .t { font-family: var(--font-hand); font-weight: 700; font-size: 1.1em; }

/* Rückmeldung */
.fb { margin-top: 16px; border-radius: 12px; padding: 14px 16px; border: 2px solid; }
.fb.ok { background: var(--ok-soft); border-color: var(--ok); }
.fb.bad { background: var(--bad-soft); border-color: var(--bad); }
.fb.warn { background: var(--warn-soft); border-color: var(--warn); }
.fbh { font-family: var(--font-display); font-weight: 800; font-size: 1.4em; }
.fb.ok .fbh { color: var(--ok); }
.fb.bad .fbh { color: var(--bad); }
.fb.warn .fbh { color: var(--warn); }
.why { margin: 8px 0; padding: 8px 12px; border-left: 4px solid var(--bad); background: var(--card); border-radius: 0 8px 8px 0; }
.fb.warn .why { border-left-color: var(--warn); }
.solline { margin: 10px 0 4px; font-weight: 700; }
.solline .s { font-size: 1.35em; }
.youline { color: var(--muted); font-size: .95em; }
details summary { cursor: pointer; font-weight: 800; color: var(--blue); margin-top: 6px; }
ol.steps { list-style: none; padding: 0; margin: 10px 0 0; counter-reset: st; display: grid; gap: 8px; }
ol.steps li { background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 12px 10px; counter-increment: st; }
ol.steps li .sh { font-family: var(--font-hand); font-weight: 700; color: var(--blue); font-size: 1.1em; display: block; }
ol.steps li .sh::before { content: "Schritt " counter(st) ": "; }
ol.steps li.trick { border: 2px solid var(--ok); }
ol.steps li.trick .sh { color: var(--ok); }
ol.steps li.trick .sh::before, ol.steps li.alert .sh::before, ol.steps li.sep .sh::before { content: ""; }
ol.steps li.trick, ol.steps li.alert, ol.steps li.sep { counter-increment: none; }
ol.steps li.alert { border: 2px solid var(--warn); }
ol.steps li.alert .sh { color: var(--warn); }
ol.steps li.sep { background: transparent; border: 0; padding: 4px 0 0; }
ol.steps li.sep .sh { color: var(--muted); }
ol.steps .calc { line-height: 2.5; }
.hint { font-size: .9em; color: var(--muted); margin-top: 4px; }
.later { font-size: .9em; color: var(--muted); margin: 10px 0 0; }
svg .s-fill { fill: var(--shape); }
svg .s-on { fill: var(--blue); }
svg .s-off { fill: var(--card); }
svg .s-line { stroke: var(--ink); fill: none; }
svg .s-edge { stroke: var(--ink); }
svg .s-dash { stroke: var(--muted); fill: none; stroke-dasharray: 5 4; }
svg .s-txt { fill: var(--ink); font-family: var(--font-body); font-weight: 800; }
svg .s-red { fill: var(--bad); }
svg .s-redl { stroke: var(--bad); }
.fig { max-width: 100%; height: auto; display: block; margin: 8px 0; }
.figrow { overflow-x: auto; }

/* Auswertung */
.result { text-align: center; }
.ring { width: 150px; height: 150px; margin: 6px auto; display: block; }
.ring .bg { stroke: var(--line); }
.ring .fg { stroke: var(--ok); transition: stroke-dashoffset 1s ease; }
.ring text { fill: var(--ink); font-family: var(--font-display); font-weight: 800; }
.result h2 { font-size: 1.8em; }
.result .note { font-family: var(--font-hand); font-size: 1.3em; color: var(--blue); }
.mistakes { text-align: left; display: grid; gap: 10px; margin-top: 16px; }
.mistake { border: 1.5px solid var(--line); border-left: 5px solid var(--bad); border-radius: 10px; padding: 10px 12px; background: var(--card); }
.mistake .src { font-size: .85em; }
.mistake .q { margin: 6px 0; }
.mistake .a { font-weight: 700; }
.mistake .d { font-size: .93em; color: var(--muted); }
.resbtns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 18px; }
.empty { color: var(--muted); text-align: center; padding: 20px 10px; }

#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
@media (max-width: 480px) {
  body { font-size: 16px; }
  .actions .btn.primary { margin-left: 0; flex: 1 1 100%; order: -1; }
  .cmp button { width: 58px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="wrap" id="app"></div>

<script>
/* ===================== Helfer ===================== */
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a; };
const lcm = (a, b) => a / gcd(a, b) * b;
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const de = x => String(Math.round(x * 1000) / 1000).replace('.', ',');
const MINUS = '−';

const fr = (n, d) => `<span class="fr"><span>${n}</span><span>${d}</span></span>`;
// Term [Ganze, Zähler, Nenner]; natürliche Zahl = [w, 0, 1]
const tH = t => {
  const [w, n, d] = t;
  if (d === 1) return `${w}`;
  if (w === 0) return fr(n, d);
  if (n === 0) return `${w}`;
  return `<span class="mx">${w}${fr(n, d)}</span>`;
};
const mxH = (w, n, d) => tH([w, n, d]);
const imp = t => ({ n: t[0] * t[2] + t[1], d: t[2] });
const eqv = (a, b) => a.n * b.d === b.n * a.d;
const simp = (n, d) => { const g = gcd(n, d) || 1; return { n: n / g, d: d / g }; };
// gekürzt und als gemischte Zahl
const parts = (n, d) => { const s = simp(n, d); return { w: Math.floor(s.n / s.d), n: s.n % s.d, d: s.d }; };
const nice = (n, d) => { const p = parts(n, d); if (p.n === 0) return `${p.w}`; return mxH(p.w, p.n, p.d); };
const opH = o => o === '-' ? ` ${MINUS} ` : ' + ';
const exprH = (t, o) => t.map((x, i) => (i ? opH(o[i - 1]) : '') + tH(x)).join('');

/* ===================== Bilder ===================== */
function barSVG(d, z, w = 300) {
  if (d > 40) return '';
  const h = 34, seg = (w - 2) / d;
  let r = '';
  for (let i = 0; i < d; i++) r += `<rect x="${1 + i * seg}" y="1" width="${seg}" height="${h}" class="${i < z ? 's-on' : 's-off'} s-edge" stroke-width="1.5"/>`;
  return `<svg class="fig" viewBox="0 0 ${w} ${h + 2}" width="${w}" role="img" aria-label="${z} von ${d} Teilen gefärbt">${r}</svg>`;
}
const SHAPES = [
  '<rect x="36" y="6" width="28" height="88" rx="2" class="s-fill s-edge" stroke-width="2"/>',
  '<polygon points="50,6 94,50 50,94 6,50" class="s-fill s-edge" stroke-width="2"/>',
  '<polygon points="50,8 94,92 6,92" class="s-fill s-edge" stroke-width="2"/>',
  '<polygon points="32,94 32,36 50,8 68,36 68,94" class="s-fill s-edge" stroke-width="2"/>',
  '<polygon points="36,6 64,6 64,36 94,36 94,64 64,64 64,94 36,94 36,64 6,64 6,36 36,36" class="s-fill s-edge" stroke-width="2"/>'
];
function shapeSVG(s, d) {
  const y = s === 2 ? 66 : 50;
  return `<svg class="fig" viewBox="0 0 100 100" width="130" role="img" aria-label="Figur, die ein ${d}-tel des Ganzen ist">${SHAPES[s]}
    <text x="50" y="${y - 6}" text-anchor="middle" class="s-txt" font-size="15">1</text>
    <line x1="42" x2="58" y1="${y}" y2="${y}" class="s-line" stroke-width="2"/>
    <text x="50" y="${y + 16}" text-anchor="middle" class="s-txt" font-size="15">${d}</text></svg>`;
}
function wholeSVG(d) {
  const cols = Math.min(d, 6), rows = Math.ceil(d / cols), s = 40;
  let r = '';
  for (let i = 0; i < d; i++) {
    const x = 2 + (i % cols) * s, y = 2 + Math.floor(i / cols) * s;
    r += i === 0 ? `<rect x="${x}" y="${y}" width="${s}" height="${s}" class="s-on s-edge" stroke-width="1.5"/>`
                 : `<rect x="${x + 2}" y="${y + 2}" width="${s - 4}" height="${s - 4}" class="s-dash" stroke-width="2"/>`;
  }
  return `<svg class="fig" viewBox="0 0 ${cols * s + 4} ${rows * s + 4}" width="${cols * s + 4}" role="img" aria-label="${d} Teile ergeben das Ganze">${r}</svg>`;
}
function strahlSVG(t, letter) {
  const x0 = 24, st = 18; let r = '';
  r += `<line x1="${x0 - 6}" x2="${x0 + 33 * st}" y1="56" y2="56" class="s-line" stroke-width="2"/>`;

function removeFehler(it) { store.set(FKEY, store.get(FKEY, []).filter(x => itemId(x) !== itemId(it))); }

/* ===================== Bewertung ===================== */
function grade(q, input) {
  // Rückgabe: { ok, form: Text bei Formfehler, diag: Text, bad }
  if (q.kind === 'frac') {
    const U = input.map(x => ({ n: x.w * x.d + x.n, d: x.d }));
    if (q.count === 2) {
      const allOk = U.every(u => eqv(u, q.ans));
      const same = input[0].w === input[1].w && input[0].n === input[1].n && input[0].d === input[1].d;
      if (allOk && same) return { ok: false, form: 'Beide Brüche haben den richtigen Wert – aber es sind zweimal dieselben. Gesucht sind zwei verschiedene.', diag: q.diag(U[0], input, 'same') };
      if (allOk) return { ok: true };
      return { ok: false, diag: q.diag(U[0], input) };
    }
    const x = input[0], u = U[0];
    if (!eqv(u, q.ans)) return { ok: false, diag: q.diag ? q.diag(u, input) : null };
    const g = gcd(x.n, x.d);
    switch (q.form) {
      case 'exact': {
        const e = q.expect[0];
        if (x.w === e.w && x.n === e.n && x.d === e.d) return { ok: true };
        return { ok: false, form: q.diag(u, input) || 'Der Wert stimmt, aber die Form passt nicht zur Aufgabe.' };
      }
      case 'lowest':
        if (g === 1 || x.n === 0) return { ok: true };
        return { ok: false, form: `Richtig gerechnet, aber noch nicht fertig: ${fr(x.n, x.d)} kann man noch durch ${g} kürzen. „So weit wie möglich“ heißt: bis es nicht mehr geht.` };
      case 'mixed':
        if (x.w > 0 && x.n < x.d) return { ok: true };
        return { ok: false, form: 'Der Wert stimmt, aber gefragt ist eine gemischte Zahl: Ganze vorne, dahinter ein echter Bruch.' };
      case 'improper':
        if (x.w === 0) return { ok: true };
        return { ok: false, form: 'Gefragt ist ein unechter Bruch – ohne Ganze davor.' };
      case 'lowestMixed': {
        if (x.n === 0) return { ok: true };
        if (x.n >= x.d) return { ok: false, form: x.w === 0 ? `Richtig gerechnet! Aber ${fr(x.n, x.d)} ist ein unechter Bruch – schreibe ihn als ${q.ans.n % q.ans.d === 0 ? 'natürliche Zahl' : 'gemischte Zahl'}: ${q.sol}.` : 'Der Bruchteil hinter den Ganzen muss ein echter Bruch sein.' };
        if (g > 1) return { ok: false, form: `Richtig gerechnet, aber noch nicht gekürzt: ${fr(x.n, x.d)} = ${fr(x.n / g, x.d / g)} (durch ${g}).` };
        return { ok: true };
      }
      default: return { ok: true };
    }
  }
  if (q.kind === 'nums') {
    const bad = q.fields.some((f, i) => Math.abs(input[i] - f.ans) > 1e-9);
    return bad ? { ok: false, diag: q.diag ? q.diag(input) : null } : { ok: true };
  }
  if (q.kind === 'choice') {
    const o = q.opts[input];
    return o.ok ? { ok: true, note: o.note && q.opts.filter(x => x.ok).length > 1 ? o.note : '' } : { ok: false, diag: o.note || null };
  }
  if (q.kind === 'cmp') return input === q.ans ? { ok: true } : { ok: false, diag: q.diag(input) };
  if (q.kind === 'order') {
    for (let i = 1; i < input.length; i++) if (q.items[input[i]].v < q.items[input[i - 1]].v - 1e-9) return { ok: false, diag: q.diag() };
    return { ok: true };
  }
  return { ok: false };
}

function makeItem(it) { const q = GEN[it.key].make(it.p); q.title = GEN[it.key].title; return q; }
function twinOf(it) { return { key: it.key, p: GEN[it.key].rand(), s: 'Ähnlich wie ' + it.s, twin: true }; }
function bookItems(topicId) { const T = TOPICS.find(t => t.id === topicId); return T.gens.flatMap(k => GEN[k].book.map(b => ({ key: k, p: b.p, s: b.s }))); }
function shortRound(topicId, n = 8) {
  const T = TOPICS.find(t => t.id === topicId), pools = T.gens.map(k => shuffle(GEN[k].book.map(b => ({ key: k, p: b.p, s: b.s }))));
  const out = []; let i = 0;
  while (out.length < n && pools.some(p => p.length)) { const p = pools[i % pools.length]; if (p.length) out.push(p.pop()); i++; }
  return out;
}
function probeItems() {
  const plan = { division: 1, divRev: 1, ganzes: 1, anteil: 2, anteilEinheit: 1, art: 2, toMixed: 1, toImproper: 1, erweitern: 1, erweiternAuf: 1, kuerzen: 2, vergleich: 2, strahl: 1, ordnen: 1, addGleich: 2, addUngleich: 2, begriff: 2 };
  const out = [];
  Object.entries(plan).forEach(([k, c]) => shuffle(GEN[k].book).slice(0, c).forEach(b => out.push({ key: k, p: b.p, s: b.s })));
  return out;
}

  if (q.kind === 'frac') {
    const out = [];
    for (let i = 0; i < (q.count || 1); i++) {
      const W = q.whole ? document.getElementById('w' + i).value.trim() : '', N = document.getElementById('n' + i).value.trim(), D = document.getElementById('d' + i).value.trim();
      if (!W && !N && !D) { msg.textContent = 'Bitte gib eine Antwort ein.'; return null; }
      if ((N && !D) || (!N && D)) { msg.textContent = 'Bitte Zähler und Nenner ausfüllen.'; return null; }
      if (D && +D === 0) { msg.textContent = 'Der Nenner darf nie 0 sein.'; return null; }
      out.push(N ? { w: +(W || 0), n: +N, d: +D } : { w: +W, n: 0, d: 1 });
    }
    return out;
  }
  if (q.kind === 'nums') {
    const v = q.fields.map((f, i) => document.getElementById('f' + i).value.trim().replace(',', '.'));
    if (v.some(x => x === '' || isNaN(+x))) { msg.textContent = 'Bitte fülle alle Felder mit einer Zahl aus.'; return null; }
    return v.map(Number);
  }
  if (q.kind === 'choice' || q.kind === 'cmp') { if (RUN.sel == null) { msg.textContent = 'Bitte wähle eine Antwort aus.'; return null; } return RUN.sel; }
  if (q.kind === 'order') { if (RUN.seq.length !== q.items.length) { msg.textContent = 'Lege zuerst alle Brüche in eine Reihenfolge.'; return null; } return RUN.seq.slice(); }
}

function youH(q, input) {
  if (input == null) return '';
  if (q.kind === 'frac') return input.map(x => x.d === 1 && x.n === 0 ? `${x.w}` : tH([x.w, x.n, x.d])).join(' und ');
  if (q.kind === 'nums') return input.map((v, i) => de(v) + (q.fields[i].unit ? ' ' + q.fields[i].unit : '')).join(', ');
  if (q.kind === 'choice') return q.opts[input].h;
  if (q.kind === 'cmp') return input === '<' ? '&lt;' : input === '>' ? '&gt;' : '=';
  if (q.kind === 'order') return input.map(i => q.items[i].h).join(' ≤ ');
  return '';
}

function stepsH(steps) {
  return `<ol class="steps">${steps.map(s => `<li class="${s.trick ? 'trick' : s.alert ? 'alert' : s.sep ? 'sep' : ''}"><span class="sh">${s.h}</span>${s.b ? `<div>${s.b}</div>` : ''}</li>`).join('')}</ol>`;
}

function check() {
  if (RUN.answered) return next();
  const q = RUN.q, input = readInput(q);
  if (input == null) return;
  finish(grade(q, input), input);
}

function finish(res, input) {
  const q = RUN.q, it = RUN.items[RUN.idx];
  RUN.answered = true;
  document.getElementById('msg').textContent = '';
  app.querySelectorAll('.answer input').forEach(i => i.disabled = true);
  if (q.kind === 'choice') app.querySelectorAll('.opt').forEach(b => { const o = q.opts[+b.dataset.i]; if (o.ok) b.classList.add('right'); else if (+b.dataset.i === input) b.classList.add('wrong'); });
  RUN.results.push({ it, ok: res.ok, res, you: youH(q, input), sol: q.sol, body: q.body, title: q.title });
  if (res.ok) { RUN.streak++; removeFehler(it); confetti(); } else { RUN.streak = 0; if (!it.twin) addFehler(it); }
  const fb = document.getElementById('fb');
  if (res.ok) {
    fb.innerHTML = `<div class="fb ok"><div class="fbh">${pick(PRAISE)}</div>${res.note ? `<p>${res.note}</p>` : ''}<details><summary>So rechnet man es – zum Nachlesen</summary>${stepsH(q.steps)}</details></div>`;
  } else {
    const cls = res.form ? 'warn' : 'bad';
    fb.innerHTML = `<div class="fb ${cls}"><div class="fbh">${res.form ? 'Fast richtig!' : 'Noch nicht richtig'}</div>
      ${input != null ? `<div class="youline">Deine Antwort: ${youH(q, input)}</div>` : ''}
      ${res.form ? `<div class="why">${res.form}</div>` : res.diag ? `<div class="why"><b>Was ist passiert?</b> ${res.diag}</div>` : ''}
      <div class="solline">Richtige Lösung: <span class="s">${q.sol}</span></div>
      <div class="hand" style="margin-top:8px;font-size:1.1em">So kommst du drauf:</div>
      ${stepsH(q.steps)}
      ${it.twin ? '' : '<p class="later">Diese Aufgabe kommt am Ende nochmal dran – zusammen mit einer ähnlichen Aufgabe.</p>'}</div>`;
  }
  const act = document.getElementById('actions');
  act.innerHTML = `<button class="btn primary" id="nextb">${RUN.idx + 1 < RUN.items.length ? 'Weiter' : 'Zur Auswertung'}</button>`;
  document.getElementById('nextb').onclick = next;
  if (!res.ok) fb.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  else document.getElementById('nextb').focus({ preventScroll: true });
}

function next() { RUN.idx++; if (RUN.idx >= RUN.items.length) summary(); else showQ(); }

function gradeNote(p) { return p >= 92 ? 1 : p >= 81 ? 2 : p >= 67 ? 3 : p >= 50 ? 4 : p >= 30 ? 5 : 6; }

function summary() {
  const res = RUN.results, ok = res.filter(r => r.ok).length, n = res.length, pct = n ? Math.round(ok / n * 100) : 0;
  const wrong = res.filter(r => !r.ok);
  if (RUN.mode === 'topic' && n) { const s = store.get(SKEY, {}); s[RUN.topic] = Math.max(s[RUN.topic] || 0, pct); store.set(SKEY, s); }
  if (RUN.mode === 'probe' && n === RUN.items.length) { const s = store.get(SKEY, {}); s.probe = Math.max(s.probe || 0, pct); store.set(SKEY, s); }
  const C = 2 * Math.PI * 62;
  const msg = pct === 100 ? 'Alles richtig – fantastisch!' : pct >= 80 ? 'Sehr gut! Nur noch ein paar Kleinigkeiten.' : pct >= 50 ? 'Guter Anfang! Jetzt die Fehler ausbessern.' : 'Dranbleiben! Mit jeder Wiederholung wird es leichter.';
  app.innerHTML = `
    <div class="top"><a class="back" href="#" id="bk">← Alle Themen</a><span class="chip">${RUN.title}</span></div>
    <div class="card result">
      <svg class="ring" viewBox="0 0 150 150" role="img" aria-label="${ok} von ${n} richtig"><circle cx="75" cy="75" r="62" class="bg" fill="none" stroke-width="14"/>
        <circle cx="75" cy="75" r="62" class="fg" fill="none" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - ok / Math.max(n, 1))}" transform="rotate(-90 75 75)"/>
        <text x="75" y="84" text-anchor="middle" font-size="30">${ok}/${n}</text></svg>
      <h2>${msg}</h2>
      ${RUN.mode === 'probe' ? `<p class="note">${pct} % richtig → ungefähr Note ${gradeNote(pct)}</p>` : `<p class="note">${pct} % richtig ${RUN.mode === 'topic' ? starsH(pct) : ''}</p>`}
      ${wrong.length ? `<div class="mistakes"><div class="section-label" style="margin:6px 0 0">Deine Fehler – kurz erklärt</div>${wrong.map(r => `
        <div class="mistake"><span class="src">${r.it.s}</span> <b>${r.title}</b>
          <div class="q">${r.body.replace(/<svg[\s\S]*?<\/svg>/g, '').replace(/<div class="figrow">[\s\S]*?<\/div>/g, '')}</div>
          ${r.you ? `<div class="d">Deine Antwort: ${r.you}</div>` : ''}
          <div class="a">Richtig: ${r.sol}</div>
          ${r.res.form || r.res.diag ? `<div class="d">${r.res.form || r.res.diag}</div>` : ''}</div>`).join('')}</div>` : '<p class="empty">Keine Fehler in dieser Runde.</p>'}
      <div class="resbtns">
        ${wrong.length ? `<button class="btn primary" id="rep">Fehler wiederholen (${wrong.length} + ${wrong.filter(r => !r.it.twin).length} ähnliche)</button>` : ''}
        <button class="btn" id="again">Nochmal mit neuen Zahlen</button>
        ${RUN.topic ? '<button class="btn ghost" id="card">Lernkarte ansehen</button>' : ''}
        <button class="btn ghost" id="home">Übersicht</button>
      </div>
    </div>`;
  if (pct >= 80 && n) confetti(140);
  const cfg = { mode: RUN.mode === 'probe' ? 'repeat' : RUN.mode, topic: RUN.topic, title: RUN.title };
  document.getElementById('bk').onclick = e => { e.preventDefault(); home(); };
  document.getElementById('home').onclick = home;
  const card = document.getElementById('card'); if (card) card.onclick = () => learn(RUN.topic);
  const rep = document.getElementById('rep');
  if (rep) rep.onclick = () => startRun({ ...cfg, title: RUN.title + ' – Fehler', items: wrong.flatMap(r => r.it.twin ? [r.it] : [{ ...r.it, rep: true }, twinOf(r.it)]) });
  document.getElementById('again').onclick = () => startRun({ ...cfg, items: res.map(r => ({ ...twinOf(r.it), s: 'Neue Zahlen', twin: false })) });
  window.scrollTo(0, 0);
}

/* ===================== Konfetti ===================== */
const cv = document.getElementById('confetti'), cx = cv.getContext('2d');
let bits = [], anim = null;
function confetti(count = 50) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = ['#ffe24a', '#2b56c9', '#18884a', '#cf3a2a', '#7ea3ff'];
  for (let i = 0; i < count; i++) bits.push({ x: innerWidth / 2 + (Math.random() - .5) * 200, y: innerHeight * .35, vx: (Math.random() - .5) * 12, vy: -Math.random() * 11 - 3, s: 5 + Math.random() * 6, c: pick(cols), r: Math.random() * 6, life: 70 + Math.random() * 30 });
  if (!anim) anim = requestAnimationFrame(tick);
}
function tick() {
  cx.clearRect(0, 0, cv.width, cv.height);
  bits.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += .2; p.life--; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); cx.restore(); });
  bits = bits.filter(p => p.life > 0 && p.y < cv.height + 20);
  anim = bits.length ? requestAnimationFrame(tick) : (cx.clearRect(0, 0, cv.width, cv.height), null);
}

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !RUN || !RUN.q) return;
  if (e.target.tagName === 'BUTTON') return;
  e.preventDefault(); RUN.answered ? next() : check();
});

/* Selbsttest für Entwickler: window.__selftest() prüft, ob alle Musterlösungen als richtig erkannt werden */
window.__selftest = () => {
  const errs = [];
  Object.entries(GEN).forEach(([k, g]) => {
    const items = g.book.map(b => b.p).concat(Array.from({ length: 40 }, () => g.rand()));
    items.forEach(p => {
      let q; try { q = g.make(p); } catch (e) { errs.push(k + ' make ' + JSON.stringify(p) + ' ' + e); return; }
      let input;
      if (q.kind === 'frac') input = q.expect || (() => { const pp = parts(q.ans.n, q.ans.d); return [q.whole ? { w: pp.w, n: pp.n, d: pp.n ? pp.d : 1 } : { w: 0, ...simp(q.ans.n, q.ans.d) }]; })();
      if (q.kind === 'frac' && input[0].n === 0 && input[0].d === 0) input = [{ w: input[0].w, n: 0, d: 1 }];
      if (q.kind === 'nums') input = q.fields.map(f => f.ans);
      if (q.kind === 'choice') input = q.opts.findIndex(o => o.ok);
      if (q.kind === 'cmp') input = q.ans;
      if (q.kind === 'order') input = q.items.map((x, i) => i).sort((a, b) => q.items[a].v - q.items[b].v);
      const r = grade(q, input);
      if (!r.ok) errs.push(k + ' ' + JSON.stringify(p) + ' -> ' + JSON.stringify(r));
      if (q.kind === 'nums' && q.fields.some(f => !Number.isInteger(f.ans))) errs.push(k + ' non-int ' + JSON.stringify(p));
      if (!q.steps || !q.steps.length) errs.push(k + ' no steps');
    });
  });
  return errs;
};

home();
</script>
