<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Honigbiene Lerntrainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout-Idee: kariertes Schulheft mit Füller-Blau, Honiggelb als Akzent, Waben als Wiedererkennung */
:root{
  --paper:#f5f7fc; --grid:#dbe3f2; --card:#ffffff; --ink:#1b2a5c; --ink-soft:#52608c;
  --honey:#f5b301; --honey-soft:#fff1c4; --on-honey:#2a1d00; --line:#c9d3ea;
  --good:#17804a; --good-soft:#dff5e8; --bad:#c2352a; --bad-soft:#fde4e0; --mark:#d6246e;
  --bee-body:#f7c331; --bee-dark:#4a3110; --wing:#cfe3ff;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#11162a; --grid:#1b2340; --card:#1a2140; --ink:#e9edfb; --ink-soft:#a9b3d8;
    --honey:#ffc533; --honey-soft:#3d3210; --on-honey:#2a1d00; --line:#313b63;
    --good:#62d394; --good-soft:#143524; --bad:#ff8a7c; --bad-soft:#44201c; --mark:#ff6aa8;
    --bee-body:#f2bb25; --bee-dark:#3a260b; --wing:#3b4d7d;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#11162a; --grid:#1b2340; --card:#1a2140; --ink:#e9edfb; --ink-soft:#a9b3d8;
  --honey:#ffc533; --honey-soft:#3d3210; --on-honey:#2a1d00; --line:#313b63;
  --good:#62d394; --good-soft:#143524; --bad:#ff8a7c; --bad-soft:#44201c; --mark:#ff6aa8;
  --bee-body:#f2bb25; --bee-dark:#3a260b; --wing:#3b4d7d;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--paper);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(1.9rem,5vw,2.6rem);font-weight:700}
h2{font-size:1.5rem;font-weight:600}
h3{font-size:1.15rem;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 64px}
header.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:2px solid var(--ink)}
.topin{max-width:860px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:1.15rem;display:flex;align-items:center;gap:8px;margin-right:auto}
.hex{width:26px;height:26px;background:var(--honey);clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%)}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav a{font-family:var(--display);font-weight:600;text-decoration:none;color:var(--ink);padding:8px 14px;border-radius:999px;border:2px solid transparent}
nav a.on{background:var(--honey);color:var(--on-honey);border-color:var(--ink)}
main{display:flex;flex-direction:column;gap:20px;padding-top:24px}
.card{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:4px 4px 0 var(--ink)}
.card.flat{box-shadow:none;border-color:var(--line)}
.soft{color:var(--ink-soft)}
.btn{font-family:var(--display);font-weight:600;border:2px solid var(--ink);background:var(--honey);color:var(--on-honey);border-radius:12px;padding:12px 20px;font-size:1.05rem;min-height:48px}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn:active{transform:translate(2px,2px)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.pill{display:inline-block;font-weight:800;font-size:.8rem;letter-spacing:.03em;padding:3px 10px;border-radius:999px;background:var(--honey-soft);color:var(--ink);border:1.5px solid var(--honey)}
.card>.pill{align-self:flex-start}
.pill.red{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.pill.green{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--display);font-weight:600;border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:8px 16px;min-height:44px}
.chip.on{background:var(--ink);color:var(--card)}
.esel{background:var(--honey-soft);border-left:6px solid var(--honey);border-radius:10px;padding:12px 14px}
.esel b.lab{display:block;font-family:var(--display);font-size:.85rem;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:2px}
.big{font-family:var(--display);font-size:1.25rem;font-weight:600}
ul.plain{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
/* Biene */
.beebox{background:var(--paper);border:2px dashed var(--line);border-radius:14px;padding:6px}
svg.bee{display:block;width:100%;height:auto;max-height:340px}
.b-out{stroke:var(--ink);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.b-body{fill:var(--bee-body)} .b-stripe{fill:var(--bee-dark)} .b-wing{fill:var(--wing);fill-opacity:.75}
.b-leg{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.b-leg.back{stroke:var(--ink-soft);opacity:.55}
.b-eye{fill:var(--ink)} .b-line{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.hl{stroke:var(--mark)!important;stroke-width:7!important}
.ring{fill:none;stroke:var(--mark);stroke-width:5}
.ring.p{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{stroke-opacity:.35}}
.spot{cursor:pointer}
.spot circle{fill:var(--card);stroke:var(--ink);stroke-width:3}
.spot text{font-family:var(--display);font-weight:700;font-size:15px;fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.spot.on circle{fill:var(--mark);stroke:var(--mark)} .spot.on text{fill:#fff}
.partinfo{min-height:96px}
/* Tabelle */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.95rem}
th,td{border:1.5px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
thead th{font-family:var(--display);background:var(--honey-soft)}
tbody th{font-family:var(--display);font-weight:600;white-space:nowrap}
.size{display:flex;flex-direction:column;gap:6px}
.size div{display:flex;align-items:center;gap:10px;font-weight:700}
.size i{display:block;height:16px;border-radius:8px;background:var(--honey);border:2px solid var(--ink)}
dl.facts{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px}
dl.facts dt{font-family:var(--display);font-weight:600;color:var(--ink-soft)}
dl.facts dd{margin:0;font-weight:700}
/* Stufen + Zeitleiste */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.step{border:2px solid var(--ink);border-radius:14px;padding:12px;background:var(--card);display:flex;flex-direction:column;gap:4px}
.step .n,.num{font-family:var(--display);font-weight:700;color:var(--on-honey);background:var(--honey);border:2px solid var(--ink);width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.tl{display:flex;flex-direction:column;gap:10px}
.job{display:grid;grid-template-columns:104px 1fr;gap:12px;align-items:start;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card)}
.job .day{font-family:var(--display);font-weight:700;background:var(--ink);color:var(--card);border-radius:10px;padding:6px 8px;text-align:center;font-variant-numeric:tabular-nums}
.job.out .day{background:var(--honey);color:var(--on-honey);border:2px solid var(--ink)}
/* Karten */
.flash{min-height:230px;justify-content:center;text-align:center;cursor:pointer}
.flash .q{font-family:var(--display);font-size:1.45rem;font-weight:600}
.flash .a{font-size:1.2rem;font-weight:800}
/* Test */
.bar{height:14px;border-radius:999px;border:2px solid var(--ink);background:var(--card);overflow:hidden}
.bar i{display:block;height:100%;background:var(--honey)}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:2px solid var(--ink);background:var(--card);border-radius:12px;padding:14px 16px;font-weight:700;min-height:52px}
.opt:disabled{cursor:default;opacity:1}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.slots{min-height:56px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.slots .chip{background:var(--honey);color:var(--on-honey)}
input.txt{font:inherit;font-weight:700;padding:12px 14px;border-radius:12px;border:2px solid var(--ink);background:var(--card);color:var(--ink);width:100%;max-width:420px;min-height:48px}
.fb{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;border:2px solid}
.fb.ok{background:var(--good-soft);border-color:var(--good)} .fb.no{background:var(--bad-soft);border-color:var(--bad)}
.fb .head{font-family:var(--display);font-weight:700;font-size:1.2rem}
.fb.ok .head{color:var(--good)} .fb.no .head{color:var(--bad)}
.score{font-family:var(--display);font-weight:700;font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.err{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.err .yours{color:var(--bad);font-weight:700} .err .corr{color:var(--good);font-weight:800}
.tcard{display:flex;flex-direction:column;gap:8px}
@media (max-width:480px){body{font-size:17px}.job{grid-template-columns:1fr}.card{padding:16px}}
@media (prefers-reduced-motion: reduce){.ring.p{animation:none}}
</style>
</head>

<header class="top"><div class="topin">
  <div class="brand"><span class="hex" aria-hidden="true"></span>Honigbiene Lerntrainer</div>
  <nav id="nav" aria-label="Bereiche">

</div></header>
<div class="wrap"><main id="app"></main></div>

      <div><i style="width:200px"></i>Königin 20 mm</div><div><i style="width:170px"></i>Drohne 16–18 mm</div><div><i style="width:140px"></i>Arbeiterin 14 mm</div></div></div>
    </section>
    <section class="card"><h2>Die ganze Tabelle</h2>
    <p class="soft">* Körperbau und Entstehung sind in deinem Heft rot angekreuzt. Schau dir diese zwei Zeilen besonders gut an.</p>
    <div class="tw"><table><thead><tr><th></th><th>Königin</th><th>Drohne</th><th>Arbeiterin</th></tr></thead><tbody>
    ${TABLE.map(r=>`<tr><th>${r.r}${r.star?" *":""}</th><td>${esc(r.k)}</td><td>${esc(r.d)}</td><td>${esc(r.a)}</td></tr>`).join("")}</tbody></table></div>
    ${esel(M.gross)}${esel(M.anz)}${esel(M.ohne)}
    <div class="esel"><b class="lab">Eselsbrücke zur Entstehung</b>Befruchtetes Ei = Weibchen (Königin und Arbeiterin). Unbefruchtetes Ei = Männchen (Drohne). Mit besonderem Futter wird aus der Larve eine Königin.</div>
    <div class="row"><button class="btn" data-act="start" data-id="staat">Test zum Bienenstaat</button><button class="btn ghost" data-act="chap" data-id="2">Weiter zu Kapitel 3</button></div></section>`;
  }
  if(ui.chap===2){
    const st=[["Ei","Die Königin legt in jede Zelle der Wabe ein Ei."],["Larve (Made)","Aus dem Ei schlüpft die Larve. Sie wird gefüttert und wächst schnell."],["Puppe","Die Zelle wird verschlossen. In der Puppe verwandelt sich die Larve."],["Biene","Die fertige Biene schlüpft aus der Zelle."]];
    h+=`<section class="card"><h2>Entwicklung der Honigbiene</h2>
    <p>Die Biene macht eine <b>vollkommene Verwandlung</b> durch. Das Fachwort dafür ist <b>Metamorphose</b>.</p>
    <div class="steps">${st.map((s,i)=>`<div class="step"><span class="n">${i+1}</span><h3>${s[0]}</h3><p class="soft">${s[1]}</p></div>`).join("")}</div>
    <p class="big">Ei → Larve (Made) → Puppe → Biene</p>
    ${esel(M.elpb)}
    <div class="esel"><b class="lab">Warum vollkommen?</b>Die Larve sieht ganz anders aus als die fertige Biene. Erst in der Puppe wird sie komplett umgebaut. Vollkommen heißt: mit Puppe.</div>
    <div class="row"><button class="btn ghost" data-act="chap" data-id="3">Weiter zu Kapitel 4</button></div></section>`;
  }
  if(ui.chap===3){const p=PARTS[ui.ipart];
    h+=`<section class="card"><h2>Lebenszyklus der Arbeitsbiene</h2>
    <p>Eine Arbeiterin hat nicht nur einen Beruf. Je älter sie wird, desto weiter kommt sie nach draußen. Gelb markierte Tage ist sie draußen, an allen anderen arbeitet sie im Stock.</p>
    <div class="tl">${JOBS.map(j=>`<div class="job${j.out?" out":""}"><div class="day">${j.d}</div><div><h3>${j.n}</h3><p>${j.t}</p>${j.o?`<p class="soft">Dafür braucht sie: <b>${j.o}</b></p>`:""}</div></div>`).join("")}</div>
    ${esel(M.innen)}${esel(M.robert)}${esel(M.tage)}
    </section>
    <section class="card"><h2>Die Organe der Arbeiterin</h2>
    <p>So sieht die Biene innen aus. Tippe auf die Nummern.</p>
    <div class="beebox">${bee({inner:1,spots:INNER,sel:ui.ipart})}</div>
    <div class="card flat partinfo"><h3>${INNER.indexOf(ui.ipart)+1} · ${esc(p.n)}</h3><p>${esc(p.t)}</p></div>
    <div class="esel"><b class="lab">Eselsbrücke: Organ und Beruf gehören zusammen</b>Amme → Futtersaftdrüse · Baubiene → Wachsdrüsen · Wächter → Wehrdrüse und Stachel · Sammelbiene → Honigmagen und Sammelbein</div>
    ${esel(M.tasche)}${esel(M.wehr)}
    <div class="row"><button class="btn" data-act="start" data-id="entwicklung">Test: Entwicklung und Berufe</button><button class="btn" data-act="start" data-id="organe">Test: Organe</button></div></section>`;
  }
  return h;
}

function deckIdx(){return CARDS.map((c,i)=>i).filter(i=>ui.deck<0||CARDS[i][0]===ui.deck);}
function vKarten(){
  const all=deckIdx();
  if(!ui.queue)ui.queue=shuffle(all.filter(i=>!store.known[i]));
  const done=all.length-ui.queue.length;
  let h=`<section class="card"><h2>Lernkarten</h2><p>Lies die Frage und sag die Antwort laut. Dann dreh die Karte um und prüfe dich ehrlich.</p>
  <div class="chips"><button class="chip${ui.deck<0?" on":""}" data-act="deck" data-id="-1">Alle</button>${TOPICS.map((t,i)=>`<button class="chip${ui.deck===i?" on":""}" data-act="deck" data-id="${i}">${t}</button>`).join("")}</div>
  <div class="bar" aria-hidden="true"><i style="width:${all.length?done/all.length*100:0}%"></i></div>
  <p class="soft">${done} von ${all.length} gewusst · noch ${ui.queue.length} im Stapel</p></section>`;
  if(!ui.queue.length){
    h+=`<section class="card"><h2>Stapel geschafft!</h2><p>Du hast alle Karten in diesem Stapel gewusst. Morgen noch einmal wiederholen, dann bleibt es im Kopf.</p><div class="row"><button class="btn" data-act="deckreset">Stapel noch einmal üben</button><a class="btn ghost" href="#tests" style="text-decoration:none">Zu den Tests</a></div></section>`;
  }else{const c=CARDS[ui.queue[0]];
    h+=`<section class="card flash" data-act="flip" tabindex="0" role="button" aria-label="Karte umdrehen">
      <span class="pill" style="align-self:center">${TOPICS[c[0]]}</span>
      <p class="q">${esc(c[1])}</p>
      ${ui.flip?`<p class="a">${esc(c[2])}</p>${esel(c[3])}`:`<p class="soft">Tippen zum Umdrehen</p>`}
    </section>`;
    h+=ui.flip?`<div class="row"><button class="btn ghost" data-act="again">Nochmal üben</button><button class="btn" data-act="knew">Wusste ich</button></div>`:`<div class="row"><button class="btn" data-act="flip">Antwort zeigen</button></div>`;
  }
  return h;
}

/* ---------- Tests ---------- */
function pick(id){
  const t=TESTS.find(x=>x.id===id);
  const pool=id==="probe"?[].concat(...Object.keys(POOL).map(k=>POOL[k].map(q=>Object.assign({src:k},q)))):POOL[id].map(q=>Object.assign({src:id},q));
  return shuffle(pool).slice(0,t.n);
}
function prep(q){const r=Object.assign({t:"mc"},q);
  if(r.t==="mc"||r.t==="label")r.opts=shuffle(r.o);
  if(r.t==="order")r.pool=shuffle(r.items.map((x,i)=>i)),r.seq=[];
  if(r.t==="order"&&r.pool.every((v,i)=>v===i))r.pool.reverse();
  return r;}
function startRun(id,qs,retry){const t=TESTS.find(x=>x.id===id);
  ui.run={id,title:retry?"Fehler-Runde: "+t.t:t.t,retry:!!retry,qs:(qs||pick(id)).map(prep),i:0,right:0,wrong:[],state:null};}
const corr=q=>q.t==="order"?q.items.join(" → "):q.t==="text"?q.show:q.o[0];
const norm=s=>s.toLowerCase().trim().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/^(der|die|das|den|dem|im|in der|mit dem|eine|ein)\s+/,"").replace(/[^a-z0-9]/g,"");
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++)m[i]=[i];for(let j=1;j<=b.length;j++)m[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length];}
function judge(q,given,ok,near){const r=ui.run;r.state={ok,given,near};if(ok)r.right++;else r.wrong.push({q,given});}

function vTests(){
  const r=ui.run;
  if(!r){
    return `<section class="card"><h2>Tests</h2><p>Nach jeder Antwort siehst du sofort, ob sie stimmt, und bekommst die Erklärung dazu. Am Ende kannst du nur deine Fehler wiederholen oder den Test neu starten. Bei jedem Start kommen die Fragen neu gemischt.</p></section>
    <section class="grid2">${TESTS.map(t=>{const b=store.best[t.id];
      return `<div class="card tcard"><h3>${t.t}</h3><p class="soft">${t.s}</p><p>${b?`<span class="pill ${b.s===b.n?"green":""}">Bestes Ergebnis: ${b.s} von ${b.n}</span>`:`<span class="pill">${t.n} Fragen</span>`}</p><button class="btn" data-act="start" data-id="${t.id}">${b?"Nochmal machen":"Starten"}</button></div>`;}).join("")}</section>`;
  }
  if(r.i>=r.qs.length)return vResult();
  const q=r.qs[r.i],st=r.state;
  let h=`<section class="card"><div class="row" style="justify-content:space-between"><span class="pill">${esc(r.title)}</span><span class="soft" style="font-weight:800">Frage ${r.i+1} von ${r.qs.length}</span></div>
  <div class="bar" aria-hidden="true"><i style="width:${r.i/r.qs.length*100}%"></i></div>`;
  if(q.t==="label")h+=`<div class="beebox">${bee({hl:q.part,inner:!!PARTS[q.part].inner})}</div>`;
  h+=`<h2>${esc(q.q)}</h2>`;
  if(q.t==="mc"||q.t==="label"){
    h+=`<div class="opts">${q.opts.map((o,i)=>{let c="";if(st){if(o===q.o[0])c=" right";else if(o===st.given)c=" wrong";}
      return `<button class="opt${c}" data-act="opt" data-id="${i}"${st?" disabled":""}>${esc(o)}</button>`;}).join("")}</div>`;
  }else if(q.t==="order"){
    h+=`<div class="slots" aria-label="Deine Reihenfolge">${q.seq.length?q.seq.map((v,i)=>`<button class="chip" data-act="orem" data-id="${i}"${st?" disabled":""}>${i+1}. ${esc(q.items[v])}</button>`).join(""):`<span class="soft">Tippe unten die Kärtchen der Reihe nach an.</span>`}</div>
    <div class="chips">${q.pool.filter(v=>!q.seq.includes(v)).map(v=>`<button class="chip" data-act="oadd" data-id="${v}"${st?" disabled":""}>${esc(q.items[v])}</button>`).join("")}</div>`;
    if(!st)h+=`<div class="row"><button class="btn" data-act="ocheck"${q.seq.length<q.items.length?" disabled style=\"opacity:.45\"":""}>Prüfen</button><span class="soft">Falsch getippt? Tippe oben auf ein Kärtchen, um es zurückzulegen.</span></div>`;
  }else if(q.t==="text"){
    h+=st?`<p>Deine Antwort: <b>${esc(st.given)}</b></p>`:`<form id="tform" class="row"><label for="antwort" class="soft" style="width:100%">Deine Antwort:</label><input class="txt" id="antwort" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn" type="submit">Prüfen</button></form>`;
  }
  if(st){
    h+=`<div class="fb ${st.ok?"ok":"no"}" role="status"><div class="head">${st.ok?(st.near?"Richtig, aber achte auf die Schreibweise":"Richtig!"):"Leider falsch"}</div>
    ${!st.ok||st.near?`<p>Richtige Antwort: <b>${esc(corr(q))}</b></p>`:""}
    <p>${esc(q.e)}</p>${esel(q.m)}</div>
    <div class="row"><button class="btn" data-act="next" id="nextbtn">${r.i+1<r.qs.length?"Nächste Frage":"Ergebnis ansehen"}</button></div>`;
  }
  h+=`</section><div class="row"><button class="btn ghost" data-act="quit">Test abbrechen</button></div>`;
  return h;
}
function vResult(){
  const r=ui.run,n=r.qs.length,pc=r.right/n,t=TESTS.find(x=>x.id===r.id);
  const msg=pc===1?"Perfekt! Alles richtig. So kann die Probe kommen.":pc>=.8?"Sehr gut! Nur noch ein paar Kleinigkeiten.":pc>=.5?"Schon ganz gut. Schau dir deine Fehler an und versuch es gleich nochmal.":"Das wird noch. Lies die Erklärungen unten und geh das Kapitel noch einmal durch.";
  let h=`<section class="card"><span class="pill">${esc(r.title)}</span>
  <div class="row" style="align-items:baseline"><span class="score">${r.right}</span><span class="big">von ${n} richtig</span></div>
  <div class="bar" aria-hidden="true"><i style="width:${pc*100}%"></i></div><p class="big">${msg}</p>
  <div class="row">${r.wrong.length?`<button class="btn" data-act="retry">Nur meine ${r.wrong.length} Fehler wiederholen</button>`:""}<button class="btn ${r.wrong.length?"ghost":""}" data-act="start" data-id="${r.id}">Test neu starten</button><button class="btn ghost" data-act="quit">Alle Tests</button>${r.id!=="probe"&&pc<.8?`<button class="btn ghost" data-act="tochap" data-id="${t.ch}">Kapitel nochmal lesen</button>`:""}</div></section>`;
  if(r.wrong.length){
    h+=`<section class="card"><h2>Deine Fehler mit Erklärung</h2>${r.wrong.map(w=>`<div class="err"><h3>${esc(w.q.q)}${w.q.t==="label"?" ("+esc(PARTS[w.q.part].n)+")":""}</h3>
      <p class="yours">Deine Antwort: ${esc(w.given||"keine")}</p><p class="corr">Richtig: ${esc(corr(w.q))}</p><p>${esc(w.q.e)}</p>${esel(w.q.m)}</div>`).join("")}</section>`;
  }
  return h;
}

/* ---------- Steuerung ---------- */
const VIEWS={start:vStart,lernen:vLernen,karten:vKarten,tests:vTests};
function route(){const v=location.hash.slice(1);return VIEWS[v]?v:"start";}
function render(top){
  const v=route();
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+v));
  app.innerHTML=VIEWS[v]();
  if(top)window.scrollTo(0,0);
  const f=document.getElementById("tform");
  if(f)f.addEventListener("submit",e=>{e.preventDefault();const q=ui.run.qs[ui.run.i];const raw=document.getElementById("antwort").value.trim();if(!raw)return;
    const g=norm(raw);let best=99;q.acc.forEach(a=>{const d=lev(g,a);const tol=a.length>=9?2:a.length>=5?1:0;if(d<=tol&&d<best)best=d;});
    judge(q,raw,best<99,best>0&&best<99);render();});
}
function act(a,id,el){
  const r=ui.run,q=r&&r.qs[r.i];
  switch(a){
    case"chap":ui.chap=+id;render(true);break;
    case"tochap":ui.chap=+id;ui.run=null;location.hash="lernen";render(true);break;
    case"part":if(ui.chap===3)ui.ipart=id;else ui.part=id;render();break;
    case"caste":ui.caste=id;render();break;
    case"deck":ui.deck=+id;ui.queue=null;ui.flip=false;render();break;
    case"deckreset":deckIdx().forEach(i=>delete store.known[i]);save();ui.queue=null;ui.flip=false;render();break;
    case"flip":ui.flip=!ui.flip;render();break;
    case"knew":store.known[ui.queue.shift()]=1;save();ui.flip=false;render();break;
    case"again":ui.queue.push(ui.queue.shift());ui.flip=false;render();break;
    case"start":startRun(id);if(route()!=="tests")location.hash="tests";render(true);break;
    case"retry":startRun(r.id,r.wrong.map(w=>w.q),true);render(true);break;
    case"quit":ui.run=null;render(true);break;
    case"opt":if(!r.state){const g=q.opts[+id];judge(q,g,g===q.o[0]);render();}break;
    case"oadd":if(!r.state){q.seq.push(+id);render();}break;
    case"orem":if(!r.state){q.seq.splice(+id,1);render();}break;
    case"ocheck":if(!r.state&&q.seq.length===q.items.length){judge(q,q.seq.map(v=>q.items[v]).join(" → "),q.seq.every((v,i)=>v===i));render();}break;
    case"next":r.i++;r.state=null;
      if(r.i>=r.qs.length&&!r.retry){const b=store.best[r.id];if(!b||r.right/r.qs.length>b.s/b.n){store.best[r.id]={s:r.right,n:r.qs.length};save();}}
      render(true);break;
  }
  if(a==="opt"||a==="ocheck"){const n=document.getElementById("nextbtn");if(n)n.scrollIntoView({block:"nearest",behavior:"smooth"});}
}
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(el&&!el.disabled)act(el.dataset.act,el.dataset.id,el);});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("[data-act]:not(button)")){e.preventDefault();e.target.click();}});
window.addEventListener("hashchange",()=>render(true));
render();
</script>
</body>
